[package]
name = "luarc-runtime"
description = "Runtime support library linked into programs generated by luarc"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# Generated programs link std + this crate + the Rust crates they import.
# `dumpster` is the managed heap's cycle collector (docs/runtime-foundation.md).
[dependencies]
dumpster = "=2.1.0"
# Same-thread guarded stacks and unwind-on-drop; no managed values cross threads.
corosensei = "=0.3.4"
